name: post
on:
  schedule:
    - cron: "0 9 * * *"   # 12:00 по Москве
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: post
        env:
          SERVERSPACE_BASE_URL: ${{ secrets.SERVERSPACE_BASE_URL }}
          SERVERSPACE_API_KEY: ${{ secrets.SERVERSPACE_API_KEY }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          DAILY_BUDGET_RUB: "100"
        run: python main.py
      - name: commit plan
        run: |
          git config user.name "ai-agent"
          git config user.email "agent@ai-from-zero.local"
          git add content_plan.json
          git diff --cached --quiet || git commit -m "content: тема опубликована"
          git push